- id: sdk-app-startup
  disabled: true
- id: sdk-jsonrpc-server
  disabled: true
- insert:
    - id: rift-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
    - id: rift-ptc-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'
    - id: rift-workflow-engine
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: codex-review
        maxConcurrentAgents: 1
        maxTotalAgents: 32
    - id: rift-subagents
      name: '@deepseek-ai/dsh-subagent'
      config:
        maxActiveSubagents: !!js Number(process.env.RIFT_TOTAL_LIMIT || (Number(process.env.RIFT_DEVELOPERS || 2) + 1))
        maxDepth: 1
    - id: rift-claude
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-code-dev
        permissionMode: acceptEdits
        model: !!js >-
          (() => {
            const model = process.env.RIFT_CLAUDE_MODEL ?? 'claude-opus-5-5';
            if (model !== 'claude-opus-5-5') {
              throw new Error('RIFT_CLAUDE_MODEL must be claude-opus-5-5.');
            }
            return model;
          })()
        env: !!js >-
          process.env.ANTHROPIC_API_KEY ? { ANTHROPIC_API_KEY: process.env.ANTHROPIC_API_KEY } : {}
    - id: rift-codex
      name: '../dist/agent/codex-provider.js'
      config:
        providerName: codex-review
        permissionMode: never
        model: !!js >-
          (() => {
            const model = process.env.RIFT_CODEX_MODEL ?? 'gpt-6.1-sol';
            if (!['gpt-6.1-sol', 'gpt-6-astra'].includes(model)) {
              throw new Error('RIFT_CODEX_MODEL must be gpt-6.1-sol or gpt-6-astra.');
            }
            return model;
          })()
    - id: rift
      name: '../dist/index.js'
      config:
        home: !!js process.env.RIFT_HOME || '.rift'
        port: !!js Number(process.env.RIFT_PORT || 47831)
        uiEnabled: !!js process.env.RIFT_UI_ENABLED !== 'false'
        leadTurnLimit: !!js Number(process.env.RIFT_LEAD_TURN_LIMIT || 4)
        leadProvider: deepseek-official
        leadModel: !!js process.env.RIFT_LEAD_MODEL || 'deepseek-flash'
        developerProvider: !!js process.env.RIFT_DEVELOPER_PROVIDER || 'claude-code-dev'
        reviewerProvider: codex-review
        limits:
          developers: !!js Number(process.env.RIFT_DEVELOPERS || 2)
          total: !!js Number(process.env.RIFT_TOTAL_LIMIT || (Number(process.env.RIFT_DEVELOPERS || 2) + 1))
        checks:
          - id: diff-check
            executable: git
            args: ['diff', '--check', 'HEAD^', 'HEAD']
