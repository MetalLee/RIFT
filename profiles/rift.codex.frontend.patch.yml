- id: sdk-app-startup
  disabled: true
- id: sdk-jsonrpc-server
  disabled: true
- insert:
    - id: rift-credentials
      name: '@deepseek-ai/dsh-credentials-local'
    - id: rift-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
    - id: rift-ptc-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'
    - id: rift-workflow-engine
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: codex-review
        maxConcurrentAgents: 1
        maxTotalAgents: 32
    - id: rift-subagents
      name: '@deepseek-ai/dsh-subagent'
      config:
        maxActiveSubagents: !!js Number(process.env.RIFT_TOTAL_LIMIT || (Number(process.env.RIFT_DEVELOPERS || 4) + 1))
        maxDepth: 1
    - id: rift-codex-dev
      name: '../dist/agent/codex-provider.js'
      config:
        providerName: codex-dev
        permissionMode: never
        model: !!js >-
          (() => {
            const model = process.env.RIFT_CODEX_DEVELOPER_MODEL ?? 'gpt-6-astra';
            if (!['gpt-6.1-sol', 'gpt-6-astra'].includes(model)) {
              throw new Error('RIFT_CODEX_DEVELOPER_MODEL must be gpt-6.1-sol or gpt-6-astra.');
            }
            return model;
          })()
    - id: rift-codex-review
      name: '../dist/agent/codex-provider.js'
      config:
        providerName: codex-review
        permissionMode: never
        model: !!js >-
          (() => {
            const model = process.env.RIFT_CODEX_MODEL ?? 'gpt-6-astra';
            if (!['gpt-6.1-sol', 'gpt-6-astra'].includes(model)) {
              throw new Error('RIFT_CODEX_MODEL must be gpt-6.1-sol or gpt-6-astra.');
            }
            return model;
          })()
    - id: rift
      name: '../dist/index.js'
      config:
        home: !!js process.env.RIFT_HOME || '.rift'
        port: !!js Number(process.env.RIFT_PORT || 47831)
        chatOrchestration: !!js process.env.RIFT_CHAT_ORCHESTRATION !== '0'
        leadProvider: deepseek-official
        leadModel: !!js process.env.RIFT_LEAD_MODEL || 'deepseek-flash'
        developerProvider: codex-dev
        reviewerProvider: codex-review
        limits:
          developers: !!js Number(process.env.RIFT_DEVELOPERS || 4)
          total: !!js Number(process.env.RIFT_TOTAL_LIMIT || (Number(process.env.RIFT_DEVELOPERS || 4) + 1))
        # Explicit serial mode shares only this candidate's ignored install/build outputs.
        checkPlan:
          mode: serial
          maxConcurrency: 1
          resourceSlots: 1
        checks:
          - id: diff-check
            executable: git
            args: ['diff', '--check', 'HEAD^', 'HEAD']
            required: true
          - id: frontend-install
            executable: pnpm
            args: ['install', '--frozen-lockfile', '--ignore-scripts', '--store-dir', '.pnpm-store', '--fetch-retries=0', '--fetch-timeout=60000']
            timeoutMs: 600000
            required: true
            dependsOn: [diff-check]
          - id: frontend-protocol
            executable: pnpm
            args: ['build:protocol']
            timeoutMs: 120000
            required: true
            dependsOn: [frontend-install]
          - id: frontend-unit
            executable: pnpm
            args: ['test:ui:prepared']
            timeoutMs: 120000
            required: true
            dependsOn: [frontend-protocol]
          - id: frontend-types
            executable: pnpm
            args: ['typecheck:ui:prepared']
            timeoutMs: 120000
            required: true
            dependsOn: [frontend-protocol]
          - id: frontend-build
            executable: pnpm
            args: ['build:ui:prepared']
            timeoutMs: 120000
            required: true
            dependsOn: [frontend-protocol]
          - id: frontend-buttons-browser
            executable: node
            args: ['scripts/check-ui-browser.mjs', '/usr/local/lib/node_modules/playwright', '/usr/local/share/ms-playwright']
            timeoutMs: 120000
            required: true
            dependsOn: [frontend-build]
